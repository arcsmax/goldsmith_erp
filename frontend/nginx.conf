# Goldsmith ERP — production SPA server (non-root nginx).
#
# Serves the built Vite bundle and proxies same-origin traffic to the backend
# container. The SPA talks to the backend through relative paths — the axios
# client uses baseURL "/api/v1" (frontend/src/api/client.ts) and the WebSocket
# hook derives ws://<window.location.host>/ws/... (frontend/src/hooks/
# useWebSocket.ts). So nginx MUST proxy /api, /ws and /uploads to the backend,
# mirroring the Vite dev proxy (frontend/vite.config.ts). Without this the
# production frontend cannot reach the backend at all.
#
# Listens on 3000 (matches podman-compose.prod.yml's port mapping); a port
# above 1024 so the non-root nginx user (uid 101) can bind it.

server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets on the fly.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # SPA history fallback — unknown paths serve index.html so client-side
    # routing (React Router) survives hard refreshes and deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry document; hashed assets below are cached hard.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Immutable, content-hashed build assets.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # REST API — forward the URI unchanged to the backend (routes live under
    # /api/v1). Forwarded headers feed the backend's get_real_ip anti-spoof.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded / generated files served by the backend.
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket notifications — requires the Upgrade/Connection handshake.
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
