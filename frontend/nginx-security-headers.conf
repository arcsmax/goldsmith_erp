# Security headers for the SPA document and its static assets (SEC-06).
#
# Included by every static location in nginx.conf. nginx drops inherited
# add_header directives in any location that declares its own, so the headers
# live here once instead of at server level. Proxied backend locations (/api,
# /uploads, /ws) do NOT include this file: the backend sets its own headers
# (middleware/security_headers.py) and two CSPs would be intersected.
#
# script-src allows exactly one inline script, the dark-mode bootstrap in
# frontend/index.html, by its sha256 hash. If that script changes, recompute:
#   python3 -c "import re,hashlib,base64;s=re.search(r'<script>(.*?)</script>',open('frontend/index.html').read(),re.S).group(1);print(base64.b64encode(hashlib.sha256(s.encode()).digest()).decode())"
# tests/scripts/test_nginx_security_headers.py fails when the hash is stale.
#
# style-src keeps 'unsafe-inline' because React style={{...}} attributes need
# it; styles cannot execute code. connect-src 'self' covers same-origin ws/wss.
# Strict-Transport-Security reaches browsers through Caddy's TLS listener;
# browsers ignore it on connections with certificate errors, so devices that
# have not yet trusted Caddy's internal CA are not locked out.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-TCSGhKaTzimh5T1JOMfBncfBZ9FYsV0g+8Ft/rdo8cE='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
