version: "3.9"   # optional but recommended

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-goldsmith}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Bind to loopback by default so a non-firewalled dev box does not
      # publish Postgres to the LAN with user:pass. Override DB_HOST_IP
      # if LAN access is actually needed (e.g., remote dev machine).
      - "${DB_HOST_IP:-127.0.0.1}:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d goldsmith"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      # Bind to loopback by default (SEC-08): an unauthenticated Redis on the
      # LAN lets anyone on the workshop Wi-Fi un-revoke tokens or corrupt the
      # cache. Override REDIS_HOST_IP if LAN access is genuinely needed.
      - "${REDIS_HOST_IP:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      bash -c "poetry run alembic upgrade head &&
              poetry run uvicorn goldsmith_erp.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
      - ./poetry.lock:/app/poetry.lock
      - ./README.md:/app/README.md
      - ./.env:/app/.env
    ports:
      # Bind to loopback by default (SEC-08): DEBUG=true (the dev default)
      # publishes /docs and relaxes every prod validator, so a plain-HTTP
      # backend on the LAN is a real risk. Override BACKEND_HOST_IP if LAN
      # access is genuinely needed — never with real customer data (see
      # README / docs/technical/infrastructure/INSTALLATION.md).
      - "${BACKEND_HOST_IP:-127.0.0.1}:8000:8000"
    environment:
      - MIGRATION_DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-goldsmith}
      - SECRET_KEY=${SECRET_KEY:-change_this_to_a_secure_random_string}
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — copy .env.example to .env}
      - POSTGRES_DB=${POSTGRES_DB:-goldsmith}
      - POSTGRES_HOST=db
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@${POSTGRES_HOST:-db}:5432/${POSTGRES_DB:-goldsmith}
      - REDIS_URL=redis://redis:6379/0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: yarn dev --host 0.0.0.0
    ports:
      - "3000:3000"
    environment:
      # Vite dev-proxy targets. vite.config.ts reads VITE_API_TARGET /
      # VITE_WS_TARGET (default localhost:8080 = the frontend container itself).
      # VITE_API_URL was read by nothing, so it is removed.
      - VITE_API_TARGET=http://backend:8000
      - VITE_WS_TARGET=ws://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - node_modules_frontend:/app/node_modules
    healthcheck:
      # frontend/Dockerfile (used here) installs neither curl nor wget, so
      # use Node's stdlib http client — always present in the node:alpine
      # base image this service builds from.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

volumes:
  db_data:
  node_modules_frontend: