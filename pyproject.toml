[tool.pylint.'MESSAGES CONTROL']
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116"   # missing-function-docstring
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.bandit]
# B101: assert used in test-like code (calendar_service health checks)
# B105: hardcoded passwords in seed_data.py (development-only sample data)
# B603/B607: subprocess calls in backup endpoint (intentional, admin-only)
skips = ["B101", "B105", "B603", "B607"]

[build-system]
requires = ["poetry-core>=1.4.0"]
build-backend = "poetry.core.masonry.api"
