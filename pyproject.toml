[tool.poetry]
name = "goldsmith_erp"
version = "0.1.0"
description = "Skalierbares, sicheres und erweiterbares ERP-System für Goldschmiede"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "goldsmith_erp", from = "src" }
]
[tool.poetry.dependencies]
python = "^3.11"
psycopg2-binary = "^2.9.11"
fastapi = "^0.140.0"
pydantic = "^2.10.0"
uvicorn = { version = "^0.32.0", extras = ["standard"] }
sqlalchemy = "^2.0.35"
asyncpg = "^0.30.0"
redis = "^5.0.0"
python-dotenv = "^1.0.0"
alembic = "^1.13.1"
boto3 = "^1.35.0"
passlib = { version = "^1.7.4", extras = ["bcrypt"] }
bcrypt = ">=4.0.0,<5.0.0"
python-multipart = ">=0.0.27,<0.1.0"
pyjwt = "^2.9.0"
pydantic-settings = "^2.6.0"
email-validator = "^2.3.0"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
slowapi = "^0.1.9"
python-json-logger = "^2.0.7"
cryptography = "^48.0.1"
ecdsa = "^0.19.1"
starlette = "^1.3.1"
fpdf2 = "^2.8.7"
jinja2 = "^3.1.6"
pillow = "^12.1.1"
aiosmtplib = "^5.1.0"
segno = "^1.6.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
black = "^26.3.1"
isort = "^5.13.0"
pylint = "^3.0.0"
mypy = "^1.8.0"
bandit = "^1.8.0"
pre-commit = "^3.6.0"
pip-audit = "^2.9.0"
pytest-cov = "^7.0.0"
httpx = "^0.28.1"
factory-boy = "^3.3.3"
aiosqlite = "^0.22.1"
greenlet = "^3.3.2"

[tool.poetry.extras]
ml = [
    "tesseract",
    "torch",
    "tensorflow",
    "scikit-learn",
    "xgboost",
    "transformers"
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.mypy]
strict = true
plugins = []

# Per-module debt ledger for the CI `lint` job's strict mypy pass.
# Currently-passing modules stay fully strict; new modules are strict by
