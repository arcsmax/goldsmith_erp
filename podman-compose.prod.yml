version: "3.9"

# Podman Compose - Production Configuration for Goldsmith ERP
# Usage: podman-compose -f podman-compose.prod.yml up -d
# First-time setup: ./setup.sh

services:
  db:
    image: docker.io/library/postgres:15-alpine
    container_name: goldsmith-db-prod
    # Pass only the variables Postgres actually needs – not the full .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goldsmith}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-goldsmith}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goldsmith} -d ${POSTGRES_DB:-goldsmith}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: goldsmith-redis-prod
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: Containerfile
    container_name: goldsmith-backend-prod
    command: >
      bash -c "cd /app && poetry run alembic upgrade head &&
               cd /app/src && poetry run uvicorn goldsmith_erp.main:app
               --host 0.0.0.0 --port 8000
               --workers 2
               --no-access-log"
    env_file: .env.production
    volumes:
      - ./uploads:/app/uploads:Z
      - ./logs:/app/logs:Z
    # Internal-only: reachable by the frontend nginx over the compose network,
    # NOT published on the host. Only Caddy publishes ports (443/80). This keeps
    # the plaintext backend off the LAN — all external traffic is TLS-terminated
    # by Caddy → frontend nginx → backend.
    expose:
      - "8000"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      # Multi-stage build → static bundle served by non-root nginx (also
      # proxies /api, /ws, /uploads to the backend). NOT the dev Containerfile,
      # which runs the Vite dev server.
      dockerfile: Containerfile.prod
    container_name: goldsmith-frontend-prod
    # Internal-only: Caddy reaches nginx on 3000 over the compose network; the
    # port is NOT published on the host. Only Caddy is exposed to the LAN.
    expose:
      # nginx listens on 3000 inside the container.
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: docker.io/library/caddy:2-alpine
    container_name: goldsmith-caddy-prod
    # The ONLY service published to the LAN. Terminates TLS on 443, redirects
    # 80 → 443, and reverse-proxies to the frontend nginx (which serves the SPA
    # and proxies /api, /ws, /uploads to the backend). See deploy/Caddyfile.
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      # Caddyfile mounted read-only (:ro); :Z relabels it for SELinux-enforcing
      # rootless hosts so Caddy (non-root) may read it.
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      # Persist Caddy's data dir so the internal CA (root.crt + key) is STABLE
      # across restarts — otherwise every device would need to re-trust a new
      # root CA on each redeploy. Export the CA from this volume:
      #   podman cp goldsmith-caddy-prod:/data/caddy/pki/authorities/local/root.crt ./caddy-root.crt
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
